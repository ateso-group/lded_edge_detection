<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LDED — Document Edge Detector Demo</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #0f172a;
            color: #e2e8f0;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 2rem;
        }
        h1 {
            font-size: 1.8rem;
            margin-bottom: 0.5rem;
            background: linear-gradient(135deg, #3b82f6, #8b5cf6);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .subtitle { color: #94a3b8; margin-bottom: 2rem; }
        .container {
            display: flex;
            flex-direction: column;
            align-items: center;
            max-width: 100%;
            width: fit-content;
        }
        .panel {
            background: #1e293b;
            border-radius: 12px;
            padding: 1.5rem;
            width: fit-content;
            max-width: 100%;
            display: flex;
            flex-direction: column;
        }
        .panel h2 { font-size: 1.1rem; margin-bottom: 1rem; color: #94a3b8; }
        .canvas-stack {
            position: relative;
            width: fit-content;
            max-width: 100%;
            margin: 0 auto;
        }
        .canvas-stack canvas {
            max-width: 100%;
            max-height: 60vh;
            border-radius: 8px;
            display: block;
        }
        #overlayCanvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
        }
        #cameraVideo {
            max-width: 100%;
            max-height: 60vh;
            border-radius: 8px;
            display: none;
        }
        .controls { margin-top: 1rem; display: flex; gap: 0.5rem; flex-wrap: wrap; justify-content: center; }
        button {
            padding: 0.6rem 1.2rem;
            border: none;
            border-radius: 8px;
            background: #3b82f6;
            color: white;
            cursor: pointer;
            font-size: 0.9rem;
            transition: background 0.2s;
        }
        button:hover { background: #2563eb; }
        button:disabled { background: #475569; cursor: not-allowed; }
        #fileInput { display: none; }
        .status {
            margin-top: 1rem;
            padding: 0.8rem;
            border-radius: 8px;
            background: #0f172a;
            font-family: monospace;
            font-size: 0.85rem;
            line-height: 1.6;
        }
        .corner-label { color: #22d3ee; }
        .confidence-label { color: #a78bfa; }
        .latency-label { color: #fbbf24; }
        .provider-label { color: #34d399; }
        .drop-zone {
            position: relative;
            transition: outline 0.2s, background 0.2s;
        }
        .drop-zone.dragover {
            outline: 3px dashed #3b82f6;
            outline-offset: -3px;
            background: rgba(59, 130, 246, 0.08);
        }
        .drop-hint {
            position: absolute;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.1rem;
            color: #3b82f6;
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.2s;
        }
        .drop-zone.dragover .drop-hint { opacity: 1; }
        .mode-toggle {
            display: flex;
            gap: 1rem;
            margin-bottom: 1.5rem;
            align-items: center;
            justify-content: center;
        }
        .mode-toggle label {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            cursor: pointer;
            font-size: 0.9rem;
            color: #94a3b8;
        }
        .toggle {
            position: relative;
            width: 44px;
            height: 24px;
            flex-shrink: 0;
        }
        .toggle input {
            opacity: 0;
            width: 0;
            height: 0;
            position: absolute;
        }
        .toggle-track {
            position: absolute;
            inset: 0;
            background: #475569;
            border-radius: 12px;
            transition: background 0.2s;
        }
        .toggle-track::before {
            content: '';
            position: absolute;
            width: 18px;
            height: 18px;
            left: 3px;
            top: 3px;
            background: white;
            border-radius: 50%;
            transition: transform 0.2s;
        }
        .toggle input:checked + .toggle-track {
            background: #3b82f6;
        }
        .toggle input:checked + .toggle-track::before {
            transform: translateX(20px);
        }
    </style>
</head>
<body>
    <h1>LDED — Document Edge Detector</h1>
    <p class="subtitle">MobileNetV3-Small + Heatmap + Soft-Argmax · ONNX Runtime Web</p>

    <div class="mode-toggle" style="display: none;">
        <label>
            <span class="toggle">
                <input type="checkbox" id="liveToggle" checked>
                <span class="toggle-track"></span>
            </span>
            🔍 Live-Erkennung
        </label>
    </div>

    <div class="container">
        <div class="panel">
            <div class="drop-zone" id="dropZone">
                <div class="canvas-stack">
                    <canvas id="inputCanvas" width="512" height="512"></canvas>
                    <video id="cameraVideo" autoplay playsinline muted></video>
                    <canvas id="overlayCanvas" width="512" height="512"></canvas>
                </div>
                <div class="drop-hint">Bild hier ablegen</div>
            </div>
            <div class="controls">
                <button id="btnUpload" onclick="document.getElementById('fileInput').click()">
                    📁 Bild laden
                </button>
                <button id="btnCamera" onclick="startCamera()">📷 Kamera</button>
                <button id="btnDetect" onclick="detect()" disabled>🔍 Erkennen</button>
                <input type="file" id="fileInput" accept="image/*" onchange="loadImage(event)">
            </div>
            <div class="status" id="status">
                Lade Modell...
            </div>
        </div>
    </div>

    <script type="module">
        // WebGPU-Bundle (enthält WebGPU + WASM-Backend). Das reine ort.min.js kann KEIN WebGPU.
        import * as ort from 'https://cdn.jsdelivr.net/npm/onnxruntime-web@1.17.0/dist/esm/ort.webgpu.min.js';

        // WASM-Dateien vom CDN laden
        ort.env.wasm.wasmPaths = 'https://cdn.jsdelivr.net/npm/onnxruntime-web@1.17.0/dist/';
        // SIMD nutzen; Multi-Threading nur wenn crossOriginIsolated (COOP/COEP) verfügbar
        ort.env.wasm.simd = true;
        ort.env.wasm.numThreads = self.crossOriginIsolated
            ? Math.min(4, navigator.hardwareConcurrency || 4)
            : 1;

        const MEAN = [0.485, 0.456, 0.406];
        const STD = [0.229, 0.224, 0.225];
        const INPUT_SIZE = 512;
        const PADDING_RATIO = 0.05;
        const CORNER_NAMES = ['TL', 'TR', 'BR', 'BL'];
        const CORNER_COLORS = ['#ef4444', '#22c55e', '#3b82f6', '#f59e0b'];

        let session = null;
        let currentImage = null;

        // Modell laden
        let activeProvider = 'wasm';
        // Modellpfade: zuerst direkt im selben Ordner, dann konfigurierte URI als Fallback
        const MODEL_PATHS = ['./lded.onnx', '../models/lded.onnx'];

        async function createSession(path) {
            // WebGPU bevorzugen (GPU-beschleunigt), sonst WASM-Fallback
            const providers = ('gpu' in navigator) ? ['webgpu', 'wasm'] : ['wasm'];
            try {
                const s = await ort.InferenceSession.create(path, {
                    executionProviders: providers,
                    graphOptimizationLevel: 'all',
                });
                activeProvider = providers[0];
                return s;
            } catch (gpuErr) {
                // Fallback rein auf WASM, falls WebGPU-Init scheitert
                const s = await ort.InferenceSession.create(path, {
                    executionProviders: ['wasm'],
                    graphOptimizationLevel: 'all',
                });
                activeProvider = 'wasm';
                return s;
            }
        }

        async function loadModel() {
            let lastErr = null;
            for (const path of MODEL_PATHS) {
                try {
                    session = await createSession(path);
                    document.getElementById('status').innerHTML =
                        `✅ Modell geladen (${activeProvider}) aus <code>${path}</code>. Bild hochladen oder Kamera starten.`;
                    document.getElementById('btnDetect').disabled = false;
                    return;
                } catch (e) {
                    lastErr = e;
                }
            }
            {
                const e = lastErr || new Error('Kein Modellpfad erreichbar');
                document.getElementById('status').innerHTML =
                    `⚠️ Modell konnte nicht geladen werden.<br>` +
                    `Starte den Server aus dem <code>lded/</code>-Verzeichnis.<br>` +
                    `<small>${e.message}</small>`;
            }
        }

        // Bild vorverarbeiten
        function preprocessImage(imageData) {
            const { width, height, data } = imageData;

            // Padding berechnen
            const pad = Math.round(PADDING_RATIO * (width + height));
            const paddedW = width + 2 * pad;
            const paddedH = height + 2 * pad;

            // Float32 Array erstellen [1, 3, 512, 512]
            const plane = INPUT_SIZE * INPUT_SIZE;
            const tensor = new Float32Array(3 * plane);

            // Skalierungsfaktoren
            const scaleX = paddedW / INPUT_SIZE;
            const scaleY = paddedH / INPUT_SIZE;

            // Vorberechnete Normalisierungsfaktoren: (v/255 - MEAN)/STD = v*invR - shift
            const invR = 1 / (255 * STD[0]), invG = 1 / (255 * STD[1]), invB = 1 / (255 * STD[2]);
            const shR = MEAN[0] / STD[0], shG = MEAN[1] / STD[1], shB = MEAN[2] / STD[2];
            // Hintergrund (Padding) = (0 - MEAN)/STD
            const bgR = -shR, bgG = -shG, bgB = -shB;

            // Quell-Spalten einmal vorberechnen (statt pro Zeile)
            const srcXs = new Int32Array(INPUT_SIZE);
            for (let x = 0; x < INPUT_SIZE; x++) {
                srcXs[x] = ((x * scaleX + 0.5) | 0) - pad;
            }

            const rOff = 0, gOff = plane, bOff = 2 * plane;
            for (let y = 0; y < INPUT_SIZE; y++) {
                const srcY = ((y * scaleY + 0.5) | 0) - pad;
                const rowBase = y * INPUT_SIZE;
                if (srcY < 0 || srcY >= height) {
                    // Ganze Zeile ist Padding
                    for (let x = 0; x < INPUT_SIZE; x++) {
                        const p = rowBase + x;
                        tensor[rOff + p] = bgR;
                        tensor[gOff + p] = bgG;
                        tensor[bOff + p] = bgB;
                    }
                    continue;
                }
                const srcRow = srcY * width;
                for (let x = 0; x < INPUT_SIZE; x++) {
                    const srcX = srcXs[x];
                    const p = rowBase + x;
                    if (srcX < 0 || srcX >= width) {
                        tensor[rOff + p] = bgR;
                        tensor[gOff + p] = bgG;
                        tensor[bOff + p] = bgB;
                    } else {
                        const idx = (srcRow + srcX) << 2;
                        tensor[rOff + p] = data[idx] * invR - shR;
                        tensor[gOff + p] = data[idx + 1] * invG - shG;
                        tensor[bOff + p] = data[idx + 2] * invB - shB;
                    }
                }
            }

            return {
                tensor: new ort.Tensor('float32', tensor, [1, 3, INPUT_SIZE, INPUT_SIZE]),
                meta: { width, height, pad, paddedW, paddedH }
            };
        }

        // Koordinaten zurückskalieren
        function rescaleCorners(coords, meta) {
            const corners = [];
            for (let i = 0; i < 4; i++) {
                let x = coords[i * 2] * meta.paddedW - meta.pad;
                let y = coords[i * 2 + 1] * meta.paddedH - meta.pad;
                x = Math.max(0, Math.min(x, meta.width - 1));
                y = Math.max(0, Math.min(y, meta.height - 1));
                corners.push({ x, y });
            }
            return corners;
        }

        // Overlay zeichnen (nur Linien + Punkte, transparenter Hintergrund)
        function drawOverlay(corners, confidence, latency) {
            const canvas = document.getElementById('overlayCanvas');
            const ctx = canvas.getContext('2d');
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // Polygon zeichnen
            ctx.beginPath();
            ctx.moveTo(corners[0].x, corners[0].y);
            for (let i = 1; i < 4; i++) {
                ctx.lineTo(corners[i].x, corners[i].y);
            }
            ctx.closePath();
            ctx.strokeStyle = '#22d3ee';
            ctx.lineWidth = Math.max(3, canvas.width / 250);
            ctx.stroke();

            // Halbtransparente Füllung
            ctx.fillStyle = 'rgba(34, 211, 238, 0.08)';
            ctx.fill();

            // Eckpunkte zeichnen
            const r = Math.max(8, canvas.width / 90);
            corners.forEach((corner, i) => {
                ctx.beginPath();
                ctx.arc(corner.x, corner.y, r, 0, 2 * Math.PI);
                ctx.fillStyle = CORNER_COLORS[i];
                ctx.fill();
            });

            // Status aktualisieren
            const conf = (1 / (1 + Math.exp(-confidence))).toFixed(3);
            const statusEl = document.getElementById('status');
            statusEl.innerHTML =
                corners.map((c, i) =>
                    `<span class="corner-label">${CORNER_NAMES[i]}</span>: (${c.x.toFixed(1)}, ${c.y.toFixed(1)})`
                ).join(' · ') +
                `<br><span class="confidence-label">Confidence:</span> ${conf}` +
                ` · <span class="latency-label">Latenz:</span> ${latency.toFixed(1)} ms` +
                ` · <span class="provider-label">Verarbeitung:</span> ${activeProvider.toUpperCase()}`;
        }

        // Detektion ausführen
        window.detect = async function() {
            if (!session || !currentImage) return;

            const inputCanvas = document.getElementById('inputCanvas');
            const fullW = inputCanvas.width;
            const fullH = inputCanvas.height;

            // Inferenz auf herunterskaliertem Offscreen-Canvas (max 512px)
            const maxSize = 512;
            const scale = Math.min(maxSize / fullW, maxSize / fullH);
            const inferW = Math.round(fullW * scale);
            const inferH = Math.round(fullH * scale);

            const tmp = document.createElement('canvas');
            tmp.width = inferW;
            tmp.height = inferH;
            const tmpCtx = tmp.getContext('2d', { willReadFrequently: true });

            const t0 = performance.now();
            tmpCtx.drawImage(inputCanvas, 0, 0, inferW, inferH);
            const imageData = tmpCtx.getImageData(0, 0, inferW, inferH);

            const { tensor, meta } = preprocessImage({
                width: inferW,
                height: inferH,
                data: imageData.data,
            });

            const results = await session.run({ image: tensor });
            const latency = performance.now() - t0;

            const coordsData = results.corners.data;
            const confidence = results.confidence.data[0];
            const inferCorners = rescaleCorners(coordsData, meta);
            // Corners auf volle Bildauflösung skalieren (scharfes Overlay)
            const corners = inferCorners.map(c => ({
                x: c.x * (fullW / inferW),
                y: c.y * (fullH / inferH)
            }));

            drawOverlay(corners, confidence, latency);
        };

        // Kamera stoppen
        function stopCamera() {
            cameraRunning = false;
            const videoEl = document.getElementById('cameraVideo');
            if (videoEl.srcObject) {
                videoEl.srcObject.getTracks().forEach(t => t.stop());
                videoEl.srcObject = null;
            }
            videoEl.style.display = 'none';
            document.getElementById('inputCanvas').style.display = 'block';
            lastCorners = null;
            displayCorners = null;
        }

        // Bild aus File-Objekt laden
        function loadFile(file) {
            if (!file || !file.type.startsWith('image/')) return;
            stopCamera();
            document.querySelector('.mode-toggle').style.display = 'none';
            const img = new Image();
            img.onload = () => {
                currentImage = { width: img.width, height: img.height };

                // Canvas in voller Bildauflösung (scharf trotz CSS-Skalierung)
                const inputCanvas = document.getElementById('inputCanvas');
                const overlayCanvas = document.getElementById('overlayCanvas');
                inputCanvas.width = img.width;
                inputCanvas.height = img.height;
                overlayCanvas.width = img.width;
                overlayCanvas.height = img.height;

                const ctx = inputCanvas.getContext('2d');
                ctx.drawImage(img, 0, 0, img.width, img.height);
                // Overlay leeren
                overlayCanvas.getContext('2d').clearRect(0, 0, img.width, img.height);
                document.getElementById('status').innerHTML = `Bild geladen: ${img.width}×${img.height}`;
            };
            img.src = URL.createObjectURL(file);
        }

        // Bild laden (File-Input)
        window.loadImage = function(event) {
            loadFile(event.target.files[0]);
        };

        // Drag & Drop
        const dropZone = document.getElementById('dropZone');
        dropZone.addEventListener('dragover', (e) => {
            e.preventDefault();
            dropZone.classList.add('dragover');
        });
        dropZone.addEventListener('dragleave', () => {
            dropZone.classList.remove('dragover');
        });
        dropZone.addEventListener('drop', (e) => {
            e.preventDefault();
            dropZone.classList.remove('dragover');
            const file = e.dataTransfer.files[0];
            loadFile(file);
        });

        // Kamera starten
        let cameraRunning = false;
        let lastCorners = null;        // Ziel-Ecken (letzte Detektion)
        let displayCorners = null;     // geglättete, angezeigte Ecken (interpoliert)
        // Glättungsfaktor pro Frame (0..1): kleiner = weicher/träger, größer = direkter
        const SMOOTHING = 0.15;
        // Wenn der Sprung zu groß ist (Szenenwechsel), sofort umschalten statt langsam gleiten
        const SNAP_DISTANCE = 200;

        function lerp(a, b, t) { return a + (b - a) * t; }

        function isLiveEnabled() {
            return document.getElementById('liveToggle').checked;
        }

        // Perspektiv-Korrektur (4-Punkt → Rechteck)
        function drawCropped(ctx, inputCanvas, corners, cw, ch) {
            // Quell-Punkte (corners in Canvas-Pixeln)
            const src = corners.map(c => [c.x, c.y]);
            // Ziel: ganzes Output-Canvas als Rechteck
            const dw = cw;
            const dh = ch;

            // Einfache bilineare Interpolation via Canvas-Transforms
            // Nutze drawImage mit Clipping für jedes Dreieck
            ctx.clearRect(0, 0, dw, dh);

            // Für ein sauberes Crop nutzen wir perspective transform approximation
            // via zwei Dreiecke (TL-TR-BR und TL-BR-BL)
            drawTriangle(ctx, inputCanvas,
                src[0], src[1], src[2],
                [0, 0], [dw, 0], [dw, dh]
            );
            drawTriangle(ctx, inputCanvas,
                src[0], src[2], src[3],
                [0, 0], [dw, dh], [0, dh]
            );
        }

        function drawTriangle(ctx, img, s0, s1, s2, d0, d1, d2) {
            ctx.save();
            ctx.beginPath();
            ctx.moveTo(d0[0], d0[1]);
            ctx.lineTo(d1[0], d1[1]);
            ctx.lineTo(d2[0], d2[1]);
            ctx.closePath();
            ctx.clip();

            // Affine transformation matrix
            const denom = (s0[0] * (s1[1] - s2[1]) + s1[0] * (s2[1] - s0[1]) + s2[0] * (s0[1] - s1[1]));
            if (Math.abs(denom) < 0.001) { ctx.restore(); return; }

            const m11 = (d0[0] * (s1[1] - s2[1]) + d1[0] * (s2[1] - s0[1]) + d2[0] * (s0[1] - s1[1])) / denom;
            const m12 = (d0[0] * (s1[0] - s2[0]) + d1[0] * (s2[0] - s0[0]) + d2[0] * (s0[0] - s1[0])) / -denom;
            const m21 = (d0[1] * (s1[1] - s2[1]) + d1[1] * (s2[1] - s0[1]) + d2[1] * (s0[1] - s1[1])) / denom;
            const m22 = (d0[1] * (s1[0] - s2[0]) + d1[1] * (s2[0] - s0[0]) + d2[1] * (s0[0] - s1[0])) / -denom;
            const dx = d0[0] - m11 * s0[0] - m12 * s0[1];
            const dy = d0[1] - m21 * s0[0] - m22 * s0[1];

            ctx.setTransform(m11, m21, m12, m22, dx, dy);
            ctx.drawImage(img, 0, 0);
            ctx.restore();
        }

        window.startCamera = async function() {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({
                    video: { facingMode: 'environment', width: 1280, height: 720 }
                });

                // Natives Video-Element für flüssige Anzeige
                const videoEl = document.getElementById('cameraVideo');
                const inputCanvas = document.getElementById('inputCanvas');
                const overlayCanvas = document.getElementById('overlayCanvas');

                videoEl.srcObject = stream;
                await videoEl.play();

                const vw = videoEl.videoWidth;
                const vh = videoEl.videoHeight;
                currentImage = { width: vw, height: vh };

                // Video anzeigen, Input-Canvas verstecken
                inputCanvas.style.display = 'none';
                videoEl.style.display = 'block';

                // Overlay-Canvas auf volle Video-Auflösung (scharf trotz CSS-Skalierung)
                overlayCanvas.width = vw;
                overlayCanvas.height = vh;

                // Verstecktes Canvas für Inferenz (kleiner, schneller)
                const maxSize = 512;
                const inferScale = Math.min(maxSize / vw, maxSize / vh);
                const inferW = Math.round(vw * inferScale);
                const inferH = Math.round(vh * inferScale);
                inputCanvas.width = inferW;
                inputCanvas.height = inferH;
                const inputCtx = inputCanvas.getContext('2d', { willReadFrequently: true });
                const overlayCtx = overlayCanvas.getContext('2d');

                cameraRunning = true;
                let detecting = false;

                // Overlay-Loop: interpoliert geglättet zu den Ziel-Ecken (flüssige Übergänge)
                function drawOverlayFrame() {
                    if (!cameraRunning) return;
                    overlayCtx.clearRect(0, 0, vw, vh);

                    if (lastCorners) {
                        if (!displayCorners) {
                            // Erste Detektion: direkt übernehmen (kein Gleiten aus dem Nichts)
                            displayCorners = lastCorners.map(c => ({ x: c.x, y: c.y }));
                        } else {
                            // Pro Ecke sanft Richtung Ziel gleiten; bei großem Sprung snappen
                            for (let i = 0; i < 4; i++) {
                                const dx = lastCorners[i].x - displayCorners[i].x;
                                const dy = lastCorners[i].y - displayCorners[i].y;
                                if (Math.hypot(dx, dy) > SNAP_DISTANCE) {
                                    displayCorners[i].x = lastCorners[i].x;
                                    displayCorners[i].y = lastCorners[i].y;
                                } else {
                                    displayCorners[i].x = lerp(displayCorners[i].x, lastCorners[i].x, SMOOTHING);
                                    displayCorners[i].y = lerp(displayCorners[i].y, lastCorners[i].y, SMOOTHING);
                                }
                            }
                        }

                        overlayCtx.beginPath();
                        overlayCtx.moveTo(displayCorners[0].x, displayCorners[0].y);
                        for (let i = 1; i < 4; i++) {
                            overlayCtx.lineTo(displayCorners[i].x, displayCorners[i].y);
                        }
                        overlayCtx.closePath();
                        overlayCtx.strokeStyle = '#22d3ee';
                        overlayCtx.lineWidth = 4;
                        overlayCtx.stroke();
                        overlayCtx.fillStyle = 'rgba(34, 211, 238, 0.08)';
                        overlayCtx.fill();
                        displayCorners.forEach((corner, i) => {
                            overlayCtx.beginPath();
                            overlayCtx.arc(corner.x, corner.y, 12, 0, 2 * Math.PI);
                            overlayCtx.fillStyle = CORNER_COLORS[i];
                            overlayCtx.fill();
                        });
                    } else {
                        displayCorners = null;
                    }
                    requestAnimationFrame(drawOverlayFrame);
                }

                // Detektion-Loop: gedrosselt (blockiert Video nicht)
                async function detectLoop() {
                    if (!cameraRunning) return;
                    if (!session || detecting || !isLiveEnabled()) {
                        if (!isLiveEnabled()) {
                            lastCorners = null;
                            document.getElementById('status').innerHTML = `📷 Kamera aktiv (Live-Erkennung aus)`;
                        }
                        setTimeout(detectLoop, 100);
                        return;
                    }
                    detecting = true;
                    try {
                        // Frame vom Video auf verstecktes Canvas kopieren
                        inputCtx.drawImage(videoEl, 0, 0, inferW, inferH);
                        const imageData = inputCtx.getImageData(0, 0, inferW, inferH);
                        const { tensor, meta } = preprocessImage({
                            width: inferW, height: inferH, data: imageData.data
                        });
                        const t0 = performance.now();
                        const results = await session.run({ image: tensor });
                        const latency = performance.now() - t0;

                        const coordsData = results.corners.data;
                        const confidence = results.confidence.data[0];
                        const inferCorners = rescaleCorners(coordsData, meta);
                        lastCorners = inferCorners.map(c => ({
                            x: c.x * (vw / inferW),
                            y: c.y * (vh / inferH)
                        }));

                        const conf = (1 / (1 + Math.exp(-confidence))).toFixed(3);
                        const fps = (1000 / latency).toFixed(0);
                        document.getElementById('status').innerHTML =
                            `📷 Live · <span class="confidence-label">Confidence:</span> ${conf}` +
                            ` · <span class="latency-label">${latency.toFixed(0)} ms (${fps} fps)</span>` +
                            ` · <span class="provider-label">${activeProvider.toUpperCase()}</span>`;
                    } catch (e) { /* skip frame */ }
                    detecting = false;
                    setTimeout(detectLoop, 50);
                }

                drawOverlayFrame();
                detectLoop();
                document.querySelector('.mode-toggle').style.display = 'flex';
                document.getElementById('status').innerHTML = `📷 Kamera aktiv: ${vw}×${vh}`;
            } catch (e) {
                document.getElementById('status').innerHTML = `❌ Kamera-Zugriff fehlgeschlagen: ${e.message}`;
            }
        };

        // Modell beim Laden initialisieren
        loadModel();
    </script>
</body>
</html>
