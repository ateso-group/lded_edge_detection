<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LDED — Document Edge Detector Demo</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #0f172a;
            color: #e2e8f0;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 2rem;
        }
        h1 {
            font-size: 1.8rem;
            margin-bottom: 0.5rem;
            background: linear-gradient(135deg, #3b82f6, #8b5cf6);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .subtitle { color: #94a3b8; margin-bottom: 2rem; }
        .container {
            display: flex;
            gap: 2rem;
            flex-wrap: wrap;
            justify-content: center;
            max-width: 1200px;
        }
        .panel {
            background: #1e293b;
            border-radius: 12px;
            padding: 1.5rem;
            min-width: 300px;
            flex: 1;
        }
        .panel h2 { font-size: 1.1rem; margin-bottom: 1rem; color: #94a3b8; }
        canvas {
            width: 100%;
            max-width: 512px;
            border-radius: 8px;
            background: #0f172a;
            display: block;
        }
        .controls { margin-top: 1rem; display: flex; gap: 0.5rem; flex-wrap: wrap; }
        button {
            padding: 0.6rem 1.2rem;
            border: none;
            border-radius: 8px;
            background: #3b82f6;
            color: white;
            cursor: pointer;
            font-size: 0.9rem;
            transition: background 0.2s;
        }
        button:hover { background: #2563eb; }
        button:disabled { background: #475569; cursor: not-allowed; }
        #fileInput { display: none; }
        .status {
            margin-top: 1rem;
            padding: 0.8rem;
            border-radius: 8px;
            background: #0f172a;
            font-family: monospace;
            font-size: 0.85rem;
            line-height: 1.6;
        }
        .corner-label { color: #22d3ee; }
        .confidence-label { color: #a78bfa; }
        .latency-label { color: #fbbf24; }
    </style>
</head>
<body>
    <h1>LDED — Document Edge Detector</h1>
    <p class="subtitle">MobileNetV3-Small + Heatmap + Soft-Argmax · ONNX Runtime Web</p>

    <div class="container">
        <div class="panel">
            <h2>Input</h2>
            <canvas id="inputCanvas" width="512" height="512"></canvas>
            <div class="controls">
                <button id="btnUpload" onclick="document.getElementById('fileInput').click()">
                    📁 Bild laden
                </button>
                <button id="btnCamera" onclick="startCamera()">📷 Kamera</button>
                <button id="btnDetect" onclick="detect()" disabled>🔍 Erkennen</button>
                <input type="file" id="fileInput" accept="image/*" onchange="loadImage(event)">
            </div>
        </div>

        <div class="panel">
            <h2>Ergebnis</h2>
            <canvas id="outputCanvas" width="512" height="512"></canvas>
            <div class="status" id="status">
                Lade Modell...
            </div>
        </div>
    </div>

    <script type="module">
        import * as ort from 'https://cdn.jsdelivr.net/npm/onnxruntime-web@1.17.0/dist/esm/ort.min.js';

        const MEAN = [0.485, 0.456, 0.406];
        const STD = [0.229, 0.224, 0.225];
        const INPUT_SIZE = 512;
        const PADDING_RATIO = 0.05;
        const CORNER_NAMES = ['TL', 'TR', 'BR', 'BL'];
        const CORNER_COLORS = ['#ef4444', '#22c55e', '#3b82f6', '#f59e0b'];

        let session = null;
        let currentImage = null;

        // Modell laden
        async function loadModel() {
            try {
                session = await ort.InferenceSession.create('./docaligner_lite.onnx', {
                    executionProviders: ['webgpu', 'wasm'],
                    graphOptimizationLevel: 'all',
                });
                document.getElementById('status').innerHTML = '✅ Modell geladen. Bild hochladen oder Kamera starten.';
                document.getElementById('btnDetect').disabled = false;
            } catch (e) {
                document.getElementById('status').innerHTML =
                    `⚠️ Modell konnte nicht geladen werden.<br>` +
                    `Platziere <code>docaligner_lite.onnx</code> im gleichen Verzeichnis.<br>` +
                    `<small>${e.message}</small>`;
            }
        }

        // Bild vorverarbeiten
        function preprocessImage(imageData) {
            const { width, height, data } = imageData;

            // Padding berechnen
            const pad = Math.round(PADDING_RATIO * (width + height));
            const paddedW = width + 2 * pad;
            const paddedH = height + 2 * pad;

            // Float32 Array erstellen [1, 3, 512, 512]
            const tensor = new Float32Array(1 * 3 * INPUT_SIZE * INPUT_SIZE);

            // Skalierungsfaktoren
            const scaleX = paddedW / INPUT_SIZE;
            const scaleY = paddedH / INPUT_SIZE;

            for (let y = 0; y < INPUT_SIZE; y++) {
                for (let x = 0; x < INPUT_SIZE; x++) {
                    // Quell-Pixel im gepadeten Bild
                    const srcX = Math.round(x * scaleX) - pad;
                    const srcY = Math.round(y * scaleY) - pad;

                    let r = 0, g = 0, b = 0;
                    if (srcX >= 0 && srcX < width && srcY >= 0 && srcY < height) {
                        const idx = (srcY * width + srcX) * 4;
                        r = data[idx] / 255.0;
                        g = data[idx + 1] / 255.0;
                        b = data[idx + 2] / 255.0;
                    }

                    // ImageNet-Normalisierung
                    const pixelIdx = y * INPUT_SIZE + x;
                    tensor[0 * INPUT_SIZE * INPUT_SIZE + pixelIdx] = (r - MEAN[0]) / STD[0];
                    tensor[1 * INPUT_SIZE * INPUT_SIZE + pixelIdx] = (g - MEAN[1]) / STD[1];
                    tensor[2 * INPUT_SIZE * INPUT_SIZE + pixelIdx] = (b - MEAN[2]) / STD[2];
                }
            }

            return {
                tensor: new ort.Tensor('float32', tensor, [1, 3, INPUT_SIZE, INPUT_SIZE]),
                meta: { width, height, pad, paddedW, paddedH }
            };
        }

        // Koordinaten zurückskalieren
        function rescaleCorners(coords, meta) {
            const corners = [];
            for (let i = 0; i < 4; i++) {
                let x = coords[i * 2] * meta.paddedW - meta.pad;
                let y = coords[i * 2 + 1] * meta.paddedH - meta.pad;
                x = Math.max(0, Math.min(x, meta.width - 1));
                y = Math.max(0, Math.min(y, meta.height - 1));
                corners.push({ x, y });
            }
            return corners;
        }

        // Ergebnis zeichnen
        function drawResult(corners, confidence, latency) {
            const canvas = document.getElementById('outputCanvas');
            const ctx = canvas.getContext('2d');

            // Input-Bild kopieren
            const inputCanvas = document.getElementById('inputCanvas');
            ctx.drawImage(inputCanvas, 0, 0, canvas.width, canvas.height);

            // Polygon zeichnen
            ctx.beginPath();
            ctx.moveTo(
                corners[0].x * canvas.width / currentImage.width,
                corners[0].y * canvas.height / currentImage.height
            );
            for (let i = 1; i < 4; i++) {
                ctx.lineTo(
                    corners[i].x * canvas.width / currentImage.width,
                    corners[i].y * canvas.height / currentImage.height
                );
            }
            ctx.closePath();
            ctx.strokeStyle = '#22d3ee';
            ctx.lineWidth = 3;
            ctx.stroke();

            // Eckpunkte zeichnen
            corners.forEach((corner, i) => {
                const sx = corner.x * canvas.width / currentImage.width;
                const sy = corner.y * canvas.height / currentImage.height;

                ctx.beginPath();
                ctx.arc(sx, sy, 8, 0, 2 * Math.PI);
                ctx.fillStyle = CORNER_COLORS[i];
                ctx.fill();
                ctx.fillStyle = 'white';
                ctx.font = 'bold 11px monospace';
                ctx.fillText(CORNER_NAMES[i], sx + 12, sy + 4);
            });

            // Status aktualisieren
            const conf = (1 / (1 + Math.exp(-confidence))).toFixed(3);
            const statusEl = document.getElementById('status');
            statusEl.innerHTML =
                corners.map((c, i) =>
                    `<span class="corner-label">${CORNER_NAMES[i]}</span>: (${c.x.toFixed(1)}, ${c.y.toFixed(1)})`
                ).join(' · ') +
                `<br><span class="confidence-label">Confidence:</span> ${conf}` +
                ` · <span class="latency-label">Latenz:</span> ${latency.toFixed(1)} ms`;
        }

        // Detektion ausführen
        window.detect = async function() {
            if (!session || !currentImage) return;

            const inputCanvas = document.getElementById('inputCanvas');
            const ctx = inputCanvas.getContext('2d');
            const imageData = ctx.getImageData(0, 0, currentImage.width, currentImage.height);

            const { tensor, meta } = preprocessImage(imageData);

            const t0 = performance.now();
            const results = await session.run({ image: tensor });
            const latency = performance.now() - t0;

            const coordsData = results.corners.data;
            const confidence = results.confidence.data[0];
            const corners = rescaleCorners(coordsData, meta);

            drawResult(corners, confidence, latency);
        };

        // Bild laden
        window.loadImage = function(event) {
            const file = event.target.files[0];
            if (!file) return;

            const img = new Image();
            img.onload = () => {
                currentImage = { width: img.width, height: img.height };
                const canvas = document.getElementById('inputCanvas');
                const ctx = canvas.getContext('2d');
                ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
                document.getElementById('status').innerHTML = `Bild geladen: ${img.width}×${img.height}`;
            };
            img.src = URL.createObjectURL(file);
        };

        // Kamera starten
        window.startCamera = async function() {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({
                    video: { facingMode: 'environment', width: 1280, height: 720 }
                });
                const video = document.createElement('video');
                video.srcObject = stream;
                video.play();

                video.onloadedmetadata = () => {
                    currentImage = { width: video.videoWidth, height: video.videoHeight };
                    const canvas = document.getElementById('inputCanvas');
                    const ctx = canvas.getContext('2d');

                    function drawFrame() {
                        ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
                        requestAnimationFrame(drawFrame);
                    }
                    drawFrame();
                    document.getElementById('status').innerHTML = `📷 Kamera aktiv: ${video.videoWidth}×${video.videoHeight}`;
                };
            } catch (e) {
                document.getElementById('status').innerHTML = `❌ Kamera-Zugriff fehlgeschlagen: ${e.message}`;
            }
        };

        // Modell beim Laden initialisieren
        loadModel();
    </script>
</body>
</html>
